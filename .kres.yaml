---
kind: common.Image
name: image-kube-service-exposer
spec:
  pushLatest: false
  extraEnvironment:
    PLATFORM: linux/amd64,linux/arm64
---
kind: golang.Build
spec:
  outputs:
    linux-amd64:
      GOOS: linux
      GOARCH: amd64
    linux-arm64:
      GOOS: linux
      GOARCH: arm64
---
kind: golang.Generate
spec:
    versionPackagePath: internal/version
---
kind: common.Release
name: release
spec:
  artifacts:
    - kube-service-exposer-*
---
kind: service.CodeCov
spec:
  targetThreshold: 40
---
kind: auto.CustomSteps
spec:
  steps:
    - name: sign-images
      toplevel: true
---
kind: custom.Step
name: sign-images
spec:
  makefile:
    enabled: true
    phony: true
    variables:
      - name: IMAGE_SIGNER_IMAGE
        defaultValue: ghcr.io/siderolabs/image-signer:v0.3.2
    script:
      - |
        @test -n "$$GITHUB_TOKEN" || { echo "GITHUB_TOKEN must be set"; exit 1; }
        @TMP=$$(mktemp -d) && trap 'rm -rf $$TMP' EXIT && \
          printf '{"auths":{"ghcr.io":{"username":"x","password":"%s"}}}' "$$GITHUB_TOKEN" > $$TMP/config.json && \
          docker run --rm -p 127.0.0.1:8585:8585 \
            -v $$TMP:/dc:ro -e DOCKER_CONFIG=/dc \
            $(IMAGE_SIGNER_IMAGE) sign --timeout=15m \
            $(REGISTRY_AND_USERNAME)/kube-service-exposer:$(IMAGE_TAG)
